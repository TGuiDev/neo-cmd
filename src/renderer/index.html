<!doctype html>
<html lang="pt-BR" data-theme="neo">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Neo CMD</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- abas -->
  <header id="titlebar">
    <div id="brand" title="Início (Alt+Home)"><img src="logo.svg" alt="Neo" width="34" height="23" /></div>
    <div id="tabs" role="tablist"></div>
    <button id="new-tab" class="tb-btn" title="Nova aba (Ctrl+T)">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div id="drag-fill"></div>
    <div id="window-controls-space"></div>
  </header>

  <!-- barra de ferramentas -->
  <nav id="toolbar">
    <button id="nav-back" class="nav-btn" title="Voltar (Alt+←)">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="nav-fwd" class="nav-btn" title="Avançar (Alt+→)">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="nav-up" class="nav-btn" title="Pasta acima (Alt+↑)">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="nav-clear" class="nav-btn" title="Limpar a tela">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="omni" class="omni">
      <span class="omni-chip" id="omni-chip"></span>
      <div class="omni-crumbs" id="omni-crumbs"></div>
      <input class="omni-input" id="omni-input" spellcheck="false" autocomplete="off"
             placeholder="Pasta, comando ou ?pergunta para o Claude" />
      <span class="omni-git hidden" id="omni-git"></span>
      <button class="omni-star" id="omni-star" title="Favoritar esta pasta (Ctrl+D)">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <div class="omni-pop hidden" id="omni-pop"></div>
    </div>

    <button id="env-btn" class="env-btn" title="Ambientes de trabalho (Ctrl+Shift+E)">
      <span class="env-ico"></span><span id="env-btn-label">Ambientes</span>
      <svg viewBox="0 0 16 16" width="12" height="12"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="toggle-claude" class="claude-btn" title="Claude Code (Ctrl+Shift+B)"><span class="spark">✦</span><span>Claude</span></button>
    <button id="update-btn" class="update-btn hidden" title="Reiniciar o Neo CMD na versão nova"></button>
    <button id="menu-btn" class="nav-btn" title="Menu">
      <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="3.2" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="12.8" r="1.3" fill="currentColor"/></svg>
    </button>
  </nav>

  <!-- favoritos -->
  <div id="bookmarks" class="hidden"></div>

  <div id="menu" class="menu hidden"></div>
  <div id="env-pop" class="menu env-menu hidden"></div>

  <main id="workspace">
    <section id="terminals"></section>
    <div id="splitter" class="hidden"><i></i></div>
    <aside id="sidebar" class="hidden">
      <div id="sidebar-head">
        <span class="spark-badge">✦</span>
        <div class="sb-titles">
          <span class="title">Claude Code</span>
          <span id="sidebar-cwd"></span>
        </div>
        <button id="claude-restart" class="nav-btn small" title="Nova conversa nesta aba">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="claude-close" class="nav-btn small" title="Fechar (Ctrl+Shift+B)">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="claude-stack"></div>
    </aside>
  </main>

  <div id="toast" class="hidden"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../../node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

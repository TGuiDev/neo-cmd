name: Build (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opcional: cria o Release com esta tag (ex.: v0.1.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Garantir binários nativos do Windows
        run: npm install --no-save @lydell/node-pty-win32-x64 @anthropic-ai/claude-code-win32-x64
      - name: Gerar executáveis (portátil, zip e instalador)
        run: npx electron-builder --win portable zip nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: neo-cmd-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Neo CMD ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.zip

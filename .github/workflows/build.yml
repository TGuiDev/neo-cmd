name: Build (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opcional: cria o Release com esta tag (ex.: v0.1.3)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache do Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências
        run: npm ci
      - name: Garantir binários nativos do Windows
        run: npm install --no-save @lydell/node-pty-win32-x64 @anthropic-ai/claude-code-win32-x64
      - name: Conferir a versão
        if: inputs.release_tag != ''
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "${{ inputs.release_tag }}" ]; then
            echo "A tag (${{ inputs.release_tag }}) precisa ser igual à versão do package.json ($v); senão a atualização automática não funciona."
            exit 1
          fi
      - name: Gerar o instalador
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Guardar o instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-cmd-instalador
          path: dist/*.exe
          retention-days: 14
      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Neo CMD ${{ inputs.release_tag || github.ref_name }}
          # latest.yml diz ao app instalado qual é a versão nova (atualização automática).
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
